<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>ENZO PERIBOIS - Partiel Harry Potter</title>
    <script src="./js/script.js" defer></script>
  </head>
  <body>
    <main>
      <header class="header">
        <div class="header__right">
          <img src="./images/logo/logo.png"/>
        </div>
        <div class="header__left">
          <img src="./images/menu.png"/>
          <h1>ENZO PERIBOIS - Wiki Harry Potter</h1>
          <ul>
            <li>MAISONS</li>
            <li>SORTS</li>
            <li>CONTACT</li>
            <li>GALLERIE</li>
          </ul>
        </div>
      </header>

      <section>
        <h3>HOUSES</h3>
        <div class="houses">
          <div data-house="Gryffindor">
            <img src="./images/logo/Gryffindor.png"/>
          </div>
          <div data-house="Hufflepuff">
            <img src="./images/logo/Hufflepuff.png"/>
          </div>
          <div data-house="Ravenclaw">
            <img src="./images/logo/Ravenclaw.png"/>
          </div>
          <div data-house="Slytherin">
            <img src="./images/logo/Slytherin.png"/>
          </div>
        </div>
      </section>

      <section>
        <h3>CHARACTERS</h3>
        <div class="characters"></div>
      </section>
    </main>

    <footer>
      <p>Wiki Happy Potter is a FANDOM community</p>
    </footer>
  </body>
</html>
