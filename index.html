<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>ENZO PERIBOIS - Partiel Harry Potter</title>
  </head>
  <body>
    <header class="header">
      <div class="header__right">
        <img src="./images/logo/logo.png" alt="Logo Harry Potter" />
      </div>
      <div class="header__left">
        <h1>ENZO PERIBOIS - Wiki Harry Potter</h1>
        <img src="./images/menu.png" alt="Ouvrir le menu" />
      </div>
    </header>

    <main>
      <section>
        <h3>HOUSES</h3>
        <div class="houses">
          <div>
            <img src="./images/logo/Gryffindor.png" alt="Blason de Gryffondor" />
          </div>
          <div>
            <img src="./images/logo/Hufflepuff.png" alt="Blason de Poufsouffle" />
          </div>
          <div>
            <img src="./images/logo/Ravenclaw.png" alt="Blason de Serdaigle" />
          </div>
          <div>
            <img src="./images/logo/Slytherin.png" alt="Blason de Serpentard" />
          </div>
        </div>
      </section>

      <section>
        <h3>CHARACTERS</h3>
        <div class="characters">
          <div>
            <img src="./images/characters/harry.webp" alt="Harry Potter" />
            <p>Harry Potter</p>
          </div>
          <div>
            <img src="./images/characters/hermione.webp" alt="Hermione Granger" />
            <p>Hermione Granger</p>
          </div>
          <div>
            <img src="./images/characters/ron.webp" alt="Ron Weasley" />
            <p>Ron Weasley</p>
          </div>
          <div>
            <img src="./images/characters/draco.webp" alt="Drago Malefoy" />
            <p>Drago Malefoy</p>
          </div>
          <div>
            <img src="./images/characters/cho.webp" alt="Cho Chang" />
            <p>Cho Chang</p>
          </div>
          <div>
            <img src="./images/characters/snape.webp" alt="Severus Snape" />
            <p>Severus Snape</p>
          </div>
          <div>
            <img src="./images/characters/mcgonagall.webp" alt="Minerva McGonagall" />
            <p>Minerva McGonagall</p>
          </div>
          <div>
            <img src="./images/characters/cedric.webp" alt="Cedric Diggory" />
            <p>Cedric Diggory</p>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>Wiki Happy Potter is a FANDOM community</p>
    </footer>
  </body>
</html>
