<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>ENZO PERIBOIS - Partiel Harry Potter</title>
    <script src="./js/script.js" defer></script>
  </head>
  <body class="page_perso">
    <main>
      <header class="header">
        <div class="header__right">
          <a href="index.html">
            <img src="./images/logo/logo.png" alt="Logo Harry Potter" />
          </a>
        </div>
        <div class="header__left">
          <img src="./images/menu.png" alt="Ouvrir le menu" />
          <h1>ENZO PERIBOIS - Wiki Harry Potter</h1>
          <ul>
            <li>MAISONS</li>
            <li>SORTS</li>
            <li>CONTACT</li>
            <li>GALLERIE</li>
          </ul>
        </div>
      </header>

      <section>
        <h3>Harry Potter</h3>
        <div class="perso">
          <figure class="perso__left">
            <img src="./images/characters/harry.webp" alt="Harry Potter" />
            <figcaption>Daniel Radcliffe</figcaption>
          </figure>
          <div class="perso__right">
            <div>
              <p>Gender</p>
              <p class="attr">Male</p>
            </div>
            <div>
              <p>Eye</p>
              <p class="attr">Green</p>
            </div>
            <div>
              <p>Hair</p>
              <p class="attr">Black</p>
            </div>
            <div>
              <p>Date of birth</p>
              <p class="attr">31-07-1980</p>
            </div>
            <div>
              <p>Patronus</p>
              <p class="attr">Stag</p>
            </div>
          </div>
        </div>
      </section>

      <section class="house__perso">
        <img src="./images/logo/Gryffindor.png" alt="Blason de Gryffondor" />
      </section>
    </main>

    <footer>
      <p>Wiki Happy Potter is a FANDOM community</p>
    </footer>
  </body>
</html>
